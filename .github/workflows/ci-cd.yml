name: Peyker Moda — CI/CD Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # CI Phase: Validation (Lint, Typecheck, Build)
  # ============================================
  validate:
    name: Validate (Lint, Typecheck & Compile)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Full history needed for Turborepo affected filters

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.0.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Turborepo Cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Run Linter
        run: pnpm lint

      - name: Check Types
        run: pnpm check-types

      - name: Build Code (Compile apps & packages)
        run: pnpm build

  # ============================================
  # Docker Verification Phase (Runs on all branches / PRs)
  # ============================================
  docker-build-test:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create Mock .env.docker
        run: |
          echo "POSTGRES_USER=peyker_user" > .env.docker
          echo "POSTGRES_PASSWORD=mock_secure_password" >> .env.docker
          echo "POSTGRES_DB=peyker_db" >> .env.docker
          echo "MINIO_ROOT_USER=minioadmin" >> .env.docker
          echo "MINIO_ROOT_PASSWORD=minioadmin" >> .env.docker
          echo "JWT_SECRET=mock_jwt_secret" >> .env.docker
          echo "ADMIN_PASSWORD=mock_admin_password" >> .env.docker

      - name: Validate Production Docker Compose Build
        run: |
          docker compose -f docker-compose.prod.yml build

  # ============================================
  # CD Phase: Automated Deployment (Only on Main/Master Branch pushes)
  # ============================================
  deploy:
    name: Production Continuous Deployment
    runs-on: ubuntu-latest
    needs: [validate, docker-build-test]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' && github.event_name == 'push'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Metot 1: Sunucuya SSH ile bağlanıp Docker Compose ile ayağa kaldırma
      - name: Deploy to Production via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.PROD_SSH_HOST }}
          username: ${{ secrets.PROD_SSH_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          port: ${{ secrets.PROD_SSH_PORT || '22' }}
          script: |
            cd /opt/peyker-moda
            git pull origin master
            docker compose -f docker-compose.prod.yml down
            docker compose -f docker-compose.prod.yml --env-file .env.docker up -d --build
            docker image prune -f
