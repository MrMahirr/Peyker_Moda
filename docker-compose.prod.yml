# ============================================
# Peyker Moda — Production Docker Compose
# ============================================
# Bu dosya production deployment için kullanılır.
# Development için: docker-compose.yml (mevcut)
#
# Kullanım:
#   docker compose -f docker-compose.prod.yml --env-file .env.docker up -d
#
# SOLID Prensipleri:
#   SRP: Her servis tek bir sorumluluk taşır
#   OCP: Env dosyası ile ortam bazlı konfigürasyon
#   ISP: Her servis sadece kendi portunu expose eder
#   DIP: Servisler hostname üzerinden birbirine bağlı

services:
  # ============================================
  # Infrastructure Services
  # ============================================

  postgres:
    image: postgres:18.3-alpine3.23
    container_name: peyker_prod_db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-peyker_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-peyker_db}
    volumes:
      - postgres_data:/var/lib/postgresql
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-peyker_user} -d ${POSTGRES_DB:-peyker_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - peyker-network
    deploy:
      resources:
        limits:
          memory: 512M

  redis:
    image: redis:8.6.2-alpine3.23
    container_name: peyker_prod_redis
    command: redis-server --requirepass ${REDIS_PASSWORD:-}
    volumes:
      - redis_data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - peyker-network
    deploy:
      resources:
        limits:
          memory: 256M

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: peyker_prod_minio
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER is required}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD is required}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    command: server /data --console-address ":9001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    networks:
      - peyker-network
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================
  # Application Services
  # ============================================

  api:
    build:
      context: .
      dockerfile: docker/api/Dockerfile
      network: host
    container_name: peyker_prod_api
    environment:
      NODE_ENV: production
      PORT: 3000
      API_PREFIX: api
      DATABASE_URL: postgresql://${POSTGRES_USER:-peyker_user}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-peyker_db}?schema=public
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-15m}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-7d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      S3_ENDPOINT: http://minio:9000
      S3_PORT: 9000
      S3_USE_SSL: "false"
      S3_ACCESS_KEY: ${MINIO_ROOT_USER}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
      S3_BUCKET: ${S3_BUCKET:-peyker-media}
      S3_REGION: us-east-1
      UPLOAD_BASE_URL: ${UPLOAD_BASE_URL:-http://localhost:9000/peyker-media}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@peyker.com}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      ADMIN_FIRST_NAME: ${ADMIN_FIRST_NAME:-Admin}
      ADMIN_LAST_NAME: ${ADMIN_LAST_NAME:-Peyker}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - peyker-network
    deploy:
      resources:
        limits:
          memory: 512M

  admin:
    build:
      context: .
      dockerfile: docker/admin/Dockerfile
      network: host
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: peyker_prod_admin
    restart: unless-stopped
    networks:
      - peyker-network
    deploy:
      resources:
        limits:
          memory: 128M

  storefront:
    build:
      context: .
      dockerfile: docker/storefront/Dockerfile
      network: host
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
    container_name: peyker_prod_storefront
    environment:
      NODE_ENV: production
      NEXT_TELEMETRY_DISABLED: 1
    restart: unless-stopped
    networks:
      - peyker-network
    deploy:
      resources:
        limits:
          memory: 256M

  # ============================================
  # Reverse Proxy (Single Entry Point — ISP)
  # ============================================

  nginx:
    build:
      context: .
      dockerfile: docker/nginx/Dockerfile
      network: host
    container_name: peyker_prod_nginx
    ports:
      - "${NGINX_HTTP_PORT:-80}:80"
      - "${NGINX_HTTPS_PORT:-443}:443"
    depends_on:
      api:
        condition: service_started
      admin:
        condition: service_started
      storefront:
        condition: service_started
    restart: unless-stopped
    networks:
      - peyker-network
    deploy:
      resources:
        limits:
          memory: 128M

# ============================================
# Volumes — Persistent Data
# ============================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  minio_data:
    driver: local

# ============================================
# Network — İzole Servis Ağı
# ============================================
networks:
  peyker-network:
    driver: bridge
