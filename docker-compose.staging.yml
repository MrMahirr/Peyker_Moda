# ============================================
# Peyker Moda — Staging Override
# ============================================
# docker-compose.prod.yml ile birlikte kullanılır; aynı sunucuda,
# production'dan tamamen izole (ayrı container/volume/veritabanı) bir
# test ortamı çalıştırmak içindir. Bu dosya production'a hiçbir etki
# yapmaz — sadece staging deploy komutunda ek olarak verilir.
#
# Kullanım:
#   docker compose -p peyker_staging \
#     -f docker-compose.prod.yml -f docker-compose.staging.yml \
#     --env-file .env.staging up -d postgres redis minio api admin storefront
#
# nginx servisi kasıtlı olarak başlatılmaz — production'daki sertleştirilmiş
# nginx, staging.peykermoda.com / admin-staging.peykermoda.com isteklerini,
# aşağıdaki servislerin de üye olduğu paylaşımlı "peyker_shared" Docker
# ağı üzerinden container adlarıyla proxy_pass eder (bkz. README).
# Sunucuda bir kere oluşturulmalı: docker network create peyker_shared

services:
  postgres:
    container_name: peyker_staging_db

  redis:
    container_name: peyker_staging_redis

  minio:
    container_name: peyker_staging_minio
    # Host'a yayınlanan portlar sadece geliştiricinin SSH tüneliyle MinIO
    # konsoluna bakabilmesi için (127.0.0.1 = sadece sunucudan erişilir).
    # Base dosya zaten ports tanımlıyor; Compose liste alanlarını
    # değiştirmek yerine birleştirdiği için burada sıfırlamak gerekiyor.
    ports: !override
      - "127.0.0.1:9002:9000"
      - "127.0.0.1:9003:9001"
    networks:
      - peyker_shared

  api:
    container_name: peyker_staging_api
    networks:
      - peyker_shared

  admin:
    container_name: peyker_staging_admin
    networks:
      - peyker_shared

  storefront:
    container_name: peyker_staging_storefront
    networks:
      - peyker_shared
